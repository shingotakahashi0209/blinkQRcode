<!-- ================================================== -->
<!--qrcodejs QRコードを作成するライブラリ-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ================================================== -->
<!-- jsPDF PDFを作成するライブラリ -->
<!-- ================================================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>
'use strict';

// ======================================================
// jsPDF
// ======================================================
const { jsPDF } = window.jspdf;

// ======================================================
// 全角数字・全角カンマを半角に変換
// ======================================================

function normalizeInput(value) {
  return value
    .replace(/[０-９]/g, char => {
      return String.fromCharCode(
        char.charCodeAt(0) - 0xFEE0
      );
    })
    .replace(/[，、]/g, ',');
}

// ======================================================
// 自由入力 をIDの配列にする。
// ======================================================

function parseFreeInput(value) {
  const normalized = normalizeInput(value);
  const parts = normalized.split(',');
  const lockIDs = [];
  for (const part of parts) {
    const trimmedID = part.trim();  /*最初と最後に空白がる場合、それをカット*/

    //IDが入力されていないものは、その後の処理をスキップして、次に行く
    // continue; はそのためのコマンド
    if (trimmedID === '') {
      continue;
    }

    /* IDは整数のみ許可 そうでない場合はえらーをだしてプログラムストップ*/
    if (!/^\d+$/.test(trimmedID)) {
      throw new Error(
        `ID「${trimmedID}」は正しい数字ではありません。`
      );
    } 
    /*上で、ちゃんとした数値であることが分かったので、各IDを作る*/
    const id = Number(trimmedID);
    /*IDの値が大きすぎないかチェック　安全な整数とは、 -(253 - 1) から 253 - 1 までのすべての整数*/
    if (!Number.isSafeInteger(id)) {
      throw new Error(
        `ID「${trimmedID}」が大きすぎます。`
      );
    }
  /*lockIDsの配列にIDを加えていく*/
    lockIDs.push(id);
  }

  if (lockIDs.length === 0) {
    throw new Error('IDを入力してください。');
  }
  return lockIDs;
}


// ======================================================
// 連番入力を ID配列にする
// ======================================================

function createConsecutiveIDs(firstValue, lastValue) {

  const firstNormalized = normalizeInput(firstValue).trim();
  const lastNormalized = normalizeInput(lastValue).trim();

  //入力されたものが数字でない場合、エラーを返す
  if (!/^\d+$/.test(firstNormalized)) {
    throw new Error('最初のIDが数字でありません。数字で入力してください。');
  }

  if (!/^\d+$/.test(lastNormalized)) {
    throw new Error('最後のIDが数字でありません。数字で入力してください。');
  }

  const firstID = Number(firstNormalized);
  const endID = Number(lastNormalized);

  if (
    !Number.isSafeInteger(firstID) ||
    !Number.isSafeInteger(endID)
  ) {
    throw new Error('IDが大きすぎます。');
  }
  //間違って最後のIDが最初のIDより小さい場合、エラーを出す
  if (endID < firstID) {
    throw new Error(
      '最後のIDは始めのID以上にしてください。'
    );
  }
  //一回に作れるIDは１０１枚以内にする。１００～２００の場合、１０１枚になるが、
  //大体の人は、１００枚だと思ってしまうので、１０１枚まで作れるようにしておくt
  if (endID - firstID+1>=102) {
    throw new Error(
      '作成するIDが100枚を超えています。一回に作れるQRの数は100枚以内です。'
    );
  }

  const lockIDs = [];

  for (
    let id = firstID;
    id <= endID;
    id++
  ) {
    lockIDs.push(id);
  }

  return lockIDs;
}


// ======================================================
// IDごとのQRコードをCanvasとして生成
// ======================================================

function generateQRCodeCanvas(lockID) {

  return new Promise((resolve, reject) => {
    // 新しい div 要素を作成します
    const container = document.createElement('div');

    container.style.position = 'absolute';
    container.style.left = '-9999px';
    container.style.top = '-9999px';

    document.body.appendChild(container);

      //まずtryブロックが実行され、例外が発生すると、catchブロックが実行される
    try {
      new QRCode(container, {
        text: String(lockID),
        width: 500,
        height: 500,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (error) {
      container.remove(); //エラーが出た場合は、コンテナを消去
      reject(error); //エラーが出た場合は、それをオブジェクトとして返す
      return;
    }

    /* QRCode.jsがCanvasを生成するまで少し待つあいだに、
     　たの部分のプログラムを停止させない
     　為にsetTimeoutを使う。ここでは時間を設定しない。
    */

    setTimeout(() => {
      const canvas = container.querySelector('canvas');
      if (!canvas) {
         container.remove();
         reject(
            new Error(
            `QRコード生成に失敗しました: ${lockID}`
              )
        );
        return;
      }

      const dataURL = canvas.toDataURL('image/png');
      container.remove();
      resolve(dataURL);
    }, 50);
  });
}


// ======================================================
// ステータス表示
// ======================================================

function showStatus(message, type = 'info') {
  const status =document.getElementById('status'); //まず、HTMLのステータスの部分を取ってくる
  status.className =`alert alert-${type} mt-3`; //タイプを変更
  status.textContent = message; //メッセージを入れる
  status.style.display = 'block'; //ブロックいっぱいに表示する
}

// ======================================================
// PDF作成のファンクション
// ======================================================

async function createLandscapeQRPDF(lockIDs, spacingX, spacingY) {
  if (!lockIDs || lockIDs.length === 0) {
    throw new Error(
      '作成するIDがありません。'
    );
  }

  // ====================================================
  // PDFのページの設定
  // ====================================================
  const doc = new jsPDF({
    orientation: 'landscape',
    unit: 'pt',
    format: 'a4'
  });

  // ====================================================
  // A4 landscape
  // ====================================================
  const PAGE_WIDTH = 841.89;
  const PAGE_HEIGHT = 595.28;
  // ====================================================
  // 6列 × 3段
  // ====================================================
  const cols = 6;
  const rows = 3;
  const marginX = 42;
  const marginY = 80; 
  //const spacingX = 22.4; // default = 22.4
  //const spacingY = 22.4; // default = 22.4
  // ====================================================
  // セルサイズ
  // ====================================================
  const cellWidth = 107.5;
  const cellHeight = 120.5;

  // ====================================================
  // QRサイズ
  // ====================================================
  const qrSize =
    cellWidth * (0.55);
  // ====================================================
  // 1ページ = 6 ID
  // ====================================================

  const idsPerPage = cols;
  const totalPages =Math.ceil(lockIDs.length/idsPerPage);


  // ====================================================
  // QR画像キャッシュ
  // 同じIDのQRは1回だけ生成し、同じQRが出てきたらエラーを出すようにする
  // ====================================================

  const qrCache = {};

  // ====================================================
  // ページ作成
  // ====================================================

  for (
    let pageIndex = 0;
    pageIndex < totalPages;
    pageIndex++
  ) {

    if (pageIndex > 0) {
      doc.addPage(
        'a4',
        'landscape'
      );
    }

    // ----------------------------------------------
    // このページのIDだけが入る配列をスライスする
    // ----------------------------------------------

    const pageStart =
      pageIndex * idsPerPage;
    
    // start<= item < end 最後は含まれないので以下のようになる
    const slicedLockIDs =
      lockIDs.slice(
        pageStart,
        pageStart + idsPerPage
      );
    //現在作っているページを表示
    showStatus(
      `PDF作成中... ${pageIndex + 1} / ${totalPages} ページ`
    );

    // ----------------------------------------------
    // 各ロックIDごとにQRコードを作成
    // ----------------------------------------------
    for (
      let j = 0;
      j < slicedLockIDs.length;
      j++
    ) {
      const lockID = slicedLockIDs[j];

      if (!qrCache[lockID]) {
        qrCache[lockID] =
          await generateQRCodeCanvas(lockID);
      }
      const qrImage = qrCache[lockID];

        // ==================================================
      // 1 IDにつき3段
      // ==================================================\
      for (
        let i = 0;
        i < rows;
        i++
      ) {

        // ----------------------------------------------
        // セル位置
        // ----------------------------------------------
        const x = marginX + j*(cellWidth + spacingX);
        const y = marginY +(i*cellHeight + i*spacingY);
                 
  
        // ----------------------------------------------
        // 枠
        // ----------------------------------------------
        doc.setLineWidth(0.5);
        doc.setDrawColor(
          0,
          0,
          0
        );
        doc.rect(
          x,
          y, 
          cellWidth,    //default = cellWidth
          cellHeight  //default: cellHeight - 35  
        );
         //default: cellHeight - 35 

        // ----------------------------------------------
        // 英語
        // ----------------------------------------------
        doc.setFont(
          'helvetica',
          'normal'
        );
        doc.setFontSize(12);
        doc.setTextColor(0,0,0);

        doc.text(
          'Scan to Unlock',
          x + cellWidth / 2,
          y + 30,
          {
            align: 'center'
          }
        );

        // ----------------------------------------------
        // 日本語
        // jsPDFの標準フォントでは日本語が
        // 正しく出ない環境があるため、
        // 日本語はCanvasで描画して画像化
        // ----------------------------------------------
        const japaneseText =
          createJapaneseTextImage('スキャンして解錠');

        doc.addImage(
          japaneseText,
          'PNG',
          x + cellWidth/2 - 45,
          y + 6,
          90,
          14
        );
        // ----------------------------------------------
        // QR のロケーション
        // ----------------------------------------------
        const centerX = x + cellWidth/2;
        const qrY = y + 39;
        const qrX = centerX -qrSize/2;
        doc.addImage(
          qrImage,
          'PNG',
          qrX,
          qrY,
          qrSize,
          qrSize
        );

        // ----------------------------------------------
        // 各QRコードの下に、どのIDかがわかるように、IDを記載
        // ----------------------------------------------

        doc.setFont(
          'helvetica',
          'bold'
        );

        doc.setFontSize(12);
        doc.setTextColor(
          0,
          0,
          0
        );

        doc.text(
          `ID: ${lockID}`,
          x + cellWidth/2,
          y + cellHeight - 6,
          {align: 'center'}
        );
      }
    }
  }


  // ====================================================
  // ファイル名
  // ====================================================

  const fileName =
    `qr_landscape_${lockIDs[0]}_${lockIDs[lockIDs.length - 1]}.pdf`;

  // ====================================================
  // ダウンロード
  // ====================================================

  doc.save(fileName);

  showStatus(
    `PDFを作成しました。 ${lockIDs.length}個のID`,
    'success'
  );
}


// ======================================================
// 日本語テキストをCanvas画像にする
// ======================================================

function createJapaneseTextImage(text) {

  const canvas =
    document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 100;

  const ctx =canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle =
    '#000000';

  ctx.font =
    'bold 73px "Yu Gothic", "Meiryo", sans-serif';

  ctx.textAlign =
    'center';

  ctx.textBaseline =
    'middle';

  ctx.fillText(
    text,
    canvas.width/2,
    canvas.height/2
  );

  return canvas.toDataURL(
    'image/png'
  );
}


// ======================================================
// 自由入力ボタンの場合
// ======================================================

document
  .getElementById('button_freeInput')
  .addEventListener(
    'click',
    async () => {
      try {
         //まずフリーインプットで入力されたものを取り出す
        const input =
          document.getElementById(
            'lockFreeInput'
          ).value;
        //フリーインプットの数字を配列にする
        const lockIDs =
          parseFreeInput(input);
        console.log(
          'lockIDs =',
          lockIDs
        );
        //スペーシングのための入力値をゲットして、数値である事を確かめる
        //最初にX
         const spaceX_free =
          document.getElementById(
            'spaceX_free'
          ).value;
         const normalizedX = normalizeInput(spaceX_free).trim();

          // Xのスペースが、ちゃんとした数字かどうかチェック
          if (normalizedX === '' || !Number.isFinite(Number(normalizedX))) {
            throw new Error(
            '横のスペースが数字ではありません。数字で入力してください。'
             );}
          const spacingX =Number(normalizedX);
          if (spacingX<0){
            throw new Error(
              '縦のスペースは０以上でなければなりません'
            )
          }
          //　つぎにY
          const spaceY_free =
          document.getElementById(
            'spaceY_free'
          ).value;
         const normalizedY = normalizeInput(spaceY_free).trim(); 
          if (normalizedY === '' || !Number.isFinite(Number(normalizedY))) {
          throw new Error(
         '縦のスペースが数字ではありません。数字で入力してください。'
          );}
          const spacingY =Number(normalizedY);
          
          if (spacingY<0){
            throw new Error(
              '横のスペースは０以上でなければなりません'
            )
          }
         console.log('conseq spaceX spaceY =', spacingX, spacingY)
        //スペースパラメターのチェックここまで
        await createLandscapeQRPDF(lockIDs, spacingX, spacingY);

      } catch (error) {
        console.error(error);
        showStatus(
          error.message,
          'danger'
        );
      }
    }
  );


// ======================================================

// ======================================================

document

  .addEventListener(
    'click',
    async () => {

      try {

        const firstValue =
          document.getElementById(
            'firstLock'
          ).value;
        const lastValue =
          document.getElementById(
            'lastLock'
          ).value;

        const lockIDs = createConsecutiveIDs(firstValue,lastValue);
        console.log(
          'lockIDs =',
          lockIDs
        );

        //スペーシングのための入力値をゲットして、数値である事を確かめる
        //まずはX
         const spaceX_conseq =
          document.getElementById(
            'spaceX_conseq'
          ).value;
         const normalizedX = normalizeInput(spaceX_conseq).trim();
          // Xのスペースが、ちゃんとした数字かどうかチェック
          if (normalizedX === '' || !Number.isFinite(Number(normalizedX))) {
            throw new Error(
            '横のスペースが数字ではありません。数字で入力してください。'
             );}
          const spacingX =Number(normalizedX);
          if (spacingX<0){
            throw new Error(
              '横のスペースは０以上でなければなりません'
            )
          }
         //次にY
          const spaceY_conseq =
          document.getElementById(
            'spaceY_conseq'
          ).value;
         const normalizedY = normalizeInput(spaceY_conseq).trim(); 
          //　Yのスペースが 数字かどうかチェック
          if (normalizedY === '' || !Number.isFinite(Number(normalizedY))) {
          throw new Error(
         '縦のスペースが数字ではありません。数字で入力してください。'
          );}
          const spacingY =Number(normalizedY);         
          if (spacingY<0){
            throw new Error(
              '縦のスペースは０以上でなければなりません'
            )
          }
         console.log('conseq spaceX spaceY =', spacingX, spacingY)
        //スペースパラメターのチェックここまで


        await createLandscapeQRPDF(lockIDs, spacingX, spacingY);
      } catch (error) {
        console.error(error);
        showStatus(
          error.message,
          'danger'
        );
      }
    }
  );

</script>
